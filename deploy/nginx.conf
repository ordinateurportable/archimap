# Образец конфига nginx. Положить в /etc/nginx/sites-available/archimap,
# сделать симлинк в sites-enabled, заменить ДОМЕН и пути.
#
# Раскладка на сервере предполагается такая:
#   /srv/archimap/web        — содержимое web/dist после npm run build
#   /srv/archimap/photos-web — уменьшенные фотографии
#   /srv/archimap/data       — edits.json, user-posts.json и uploads/,
#                              их пишет сервер правок
#   сервер правок слушает 127.0.0.1:5174

# Кэш подложки карты (location /ofm/ и /osm/ ниже): 500 МБ — на диске
# стенда всего около 3 ГБ свободно
proxy_cache_path /var/cache/nginx/archimap-tiles levels=1:2 keys_zone=archimap_tiles:20m max_size=500m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name ДОМЕН;

    root /srv/archimap/web;
    index index.html;

    # Данные уже сжаты заранее (см. deploy/README), nginx отдаёт .gz как есть.
    # Без этого ru.json поедет несжатым — 14 МБ вместо 4.
    gzip_static on;
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    client_max_body_size 128k;   # сервер правок больше и не принимает

    # Фотографии. Имена файлов неизменны, поэтому кэшируем надолго.
    location /photos/ {
        alias /srv/archimap/photos-web/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Данные: имя файла постоянное, поэтому проверяем изменения по ETag.
    location /data/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Подложка карты — через наш сервер: из России без VPN OpenFreeMap
    # отвечает и виснет, tile.openstreetmap.org не отвечает вовсе, а сервер
    # забирает те же тайлы за 0,1 с (deploy/check-map.sh, 30.09). Кэш —
    # archimap_tiles (proxy_cache_path в начале файла). Стили и описание
    # тайлов меняются — час; тайлы, шрифты и спрайты с версией в пути — месяц.
    location /ofm/ {
        proxy_pass https://tiles.openfreemap.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host tiles.openfreemap.org;
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_cache archimap_tiles;
        proxy_cache_valid 200 1h;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        expires 1h;
    }
    location ~ ^/ofm/(planet/[^/]+/|fonts/|sprites/) {
        rewrite ^/ofm/(.*)$ /$1 break;
        proxy_pass https://tiles.openfreemap.org;
        proxy_ssl_server_name on;
        proxy_set_header Host tiles.openfreemap.org;
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_cache archimap_tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        expires 30d;
    }
    # запасная подложка — растровые тайлы OpenStreetMap, тоже через нас
    location /osm/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "archimap/1.0 (+https://archimap.194.226.142.99.sslip.io)";
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_cache archimap_tiles;
        proxy_cache_valid 200 7d;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        expires 7d;
    }

    # Страницу браузер сверяет с сервером при каждом заходе: без заголовка
    # он держал старый index.html часами, и после выкладки открывалась
    # прежняя версия сайта.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Сборка Vite кладёт хэш в имя файла — можно кэшировать навсегда.
    location /assets/ {
        # nginx не знает расширение .mjs и отдаёт его как octet-stream,
        # а браузер отказывается исполнять модуль с таким типом. Из-за
        # этого молча не запускается воркер MapLibre и карта остаётся
        # пустой — без единой ошибки в консоли.
        types {
            application/javascript  js mjs;
            text/css                css;
            image/svg+xml           svg;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Посты посетителей приходят вместе с фотографиями (до четырёх,
    # каждая уже ужата браузером), поэтому здесь предел больше общего.
    location = /api/user-posts {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Правки, предложения и фотографии посетителей (/api/uploads/).
    location /api/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # по этому заголовку сервер считает ограничения частоты,
        # поэтому в server/.env нужен TRUST_PROXY=1
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Приложение одностраничное: все прочие адреса отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
