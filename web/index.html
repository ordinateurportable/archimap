<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Архитектурные излишества — разбор постов</title>
    <!--
      Интерфейс оформлен под iOS 8, а его шрифт — Helvetica Neue. Просто
      назвать её в CSS нельзя: на многих Windows-машинах стоит сторонняя
      «Helvetica Neue» со сломанной кириллицей, и браузер берёт именно её —
      в тексте появляются заглавные посреди слов. Arimo повторяет метрики
      Helvetica и Arial, кириллицу содержит полностью. Без сети всё
      откатится на системный шрифт, см. font-family в styles.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&display=swap&subset=cyrillic,latin"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
